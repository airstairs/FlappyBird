<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Retro Pixel Flappy Bird - Dynamic Day & Night Cycle</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            image-rendering: pixelated;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            background: #080a0f;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
        }

        .game-wrapper {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: 480px;
            max-height: 900px;
            overflow: hidden;
            box-shadow: 0 0 40px rgba(0,0,0,0.9);
            cursor: pointer;
            transition: filter 0.5s ease;
        }

        /* Continuous Dynamic Sky Background */
        .sky-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            transition: background 1s linear;
        }

        /* Celestial Container (Sun & Moon Cycle) */
        .celestial-orbit {
            position: absolute;
            top: 8vh;
            left: 50%;
            width: 280px;
            height: 280px;
            margin-left: -140px;
            pointer-events: none;
            z-index: 1;
            transform-origin: center center;
            transition: transform 0.5s linear;
        }

        .sun-body {
            position: absolute;
            top: 0;
            left: 120px;
            width: 36px;
            height: 36px;
            background: #ffe135;
            border: 3px solid #f39c12;
            border-radius: 4px;
            box-shadow: 0 0 15px #f1c40f, inset -3px -3px 0 #f39c12;
        }

        .moon-body {
            position: absolute;
            bottom: 0;
            left: 120px;
            width: 32px;
            height: 32px;
            background: #e0e6ed;
            border: 3px solid #95a5a6;
            border-radius: 4px;
            box-shadow: 0 0 12px #ecf0f1, inset -4px -4px 0 #bdc3c7;
        }

        /* Twinkling Pixel Stars for Night */
        .stars-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 60%;
            z-index: 1;
            opacity: 0;
            transition: opacity 1.5s ease;
            pointer-events: none;
            background-image: 
                radial-gradient(2px 2px at 20px 30px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 80px 70px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(3px 3px at 150px 40px, #f1c40f, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 220px 120px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 280px 50px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(3px 3px at 320px 90px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 380px 30px, #ffffff, rgba(0,0,0,0));
            background-repeat: repeat;
            background-size: 200px 150px;
            animation: twinkle 2s infinite alternate;
        }

        @keyframes twinkle {
            0% { opacity: 0.3; }
            100% { opacity: 0.9; }
        }

        /* Cloud Layer with Dynamic Tinting */
        .clouds-layer {
            position: absolute;
            bottom: 18vh;
            left: 0;
            width: 200%;
            height: 25vh;
            background-image: 
                radial-gradient(ellipse at 20% 50%, var(--cloud-color, #dbf1cd) 25%, transparent 26%),
                radial-gradient(ellipse at 40% 40%, var(--cloud-color, #dbf1cd) 30%, transparent 31%),
                radial-gradient(ellipse at 70% 60%, var(--cloud-color, #dbf1cd) 20%, transparent 21%);
            background-repeat: repeat-x;
            background-size: 300px 100px;
            animation: scrollClouds 30s linear infinite;
            z-index: 2;
            opacity: 0.8;
            transition: filter 1s ease;
        }

        @keyframes scrollClouds {
            from { transform: translateX(0); }
            to { transform: translateX(-50%); }
        }

        /* City Skyline with Night Windows */
        .city-layer {
            position: absolute;
            bottom: 18vh;
            left: 0;
            width: 200%;
            height: 30vh;
            background-image: 
                linear-gradient(90deg, var(--city-color, #81d4e1) 15px, transparent 15px),
                linear-gradient(90deg, var(--city-color, #81d4e1) 25px, transparent 25px),
                linear-gradient(90deg, var(--city-color-dark, #71c4d1) 20px, transparent 20px);
            background-size: 120px 180px, 180px 220px, 90px 140px;
            background-position: 0 bottom, 50px bottom, 20px bottom;
            background-repeat: repeat-x;
            animation: scrollCity 15s linear infinite;
            z-index: 3;
            transition: filter 1s ease;
        }

        @keyframes scrollCity {
            from { transform: translateX(0); }
            to { transform: translateX(-50%); }
        }

        /* Night Building Window Lights */
        .city-windows {
            position: absolute;
            bottom: 18vh;
            left: 0;
            width: 200%;
            height: 30vh;
            background-image: 
                radial-gradient(2px 3px at 35px 220px, #f1c40f 100%, transparent 0),
                radial-gradient(2px 3px at 45px 240px, #f1c40f 100%, transparent 0),
                radial-gradient(2px 3px at 85px 190px, #ffe135 100%, transparent 0),
                radial-gradient(2px 3px at 120px 250px, #f1c40f 100%, transparent 0),
                radial-gradient(2px 3px at 145px 210px, #f39c12 100%, transparent 0);
            background-size: 180px 280px;
            background-repeat: repeat-x;
            animation: scrollCity 15s linear infinite;
            z-index: 4;
            opacity: 0;
            transition: opacity 1.2s ease;
            pointer-events: none;
        }

        /* NINTENDO-STYLE PIXEL GROUND */
        .ground-container {
            position: absolute;
            bottom: 0;
            width: 200%;
            height: 18vh;
            min-height: 110px;
            z-index: 7;
            animation: scrollGround 3.5s linear infinite;
            display: flex;
            flex-direction: column;
            transition: filter 1s ease;
        }

        .grass-top-blades {
            width: 100%;
            height: 8px;
            background-color: #000;
            background-image: 
                linear-gradient(90deg, 
                    #5c940d 0px, #5c940d 8px,
                    #70b214 8px, #70b214 16px,
                    #86db1a 16px, #86db1a 24px,
                    #5c940d 24px, #5c940d 32px
                );
            background-size: 32px 8px;
            box-shadow: inset 0 2px 0 #a2f033;
        }

        .grass-block {
            width: 100%;
            height: 20px;
            background: #70b214;
            border-top: 3px solid #86db1a;
            border-bottom: 4px solid #000;
            position: relative;
            background-image: repeating-linear-gradient(
                90deg,
                #70b214 0px, #70b214 8px,
                #86db1a 8px, #86db1a 12px,
                #5c940d 12px, #5c940d 16px,
                #70b214 16px, #70b214 32px
            );
        }

        .dirt-block {
            flex: 1;
            width: 100%;
            background-color: #c84c0c;
            border-top: 2px solid #e7732f;
            background-image: 
                linear-gradient(90deg, #000 2px, transparent 2px),
                linear-gradient(0deg, #000 2px, transparent 2px),
                radial-gradient(#e7732f 15%, transparent 16%),
                radial-gradient(#802400 20%, transparent 21%);
            background-size: 32px 32px, 32px 32px, 16px 16px, 32px 32px;
            background-position: 0 0, 0 0, 4px 4px, 12px 12px;
        }

        @keyframes scrollGround {
            from { transform: translateX(0); }
            to { transform: translateX(-50%); }
        }

        /* Pixel Bird */
        .bird {
            position: absolute;
            width: 42px;
            height: 30px;
            background-color: #f7d519;
            border: 2px solid #000;
            border-radius: 4px;
            left: 20%;
            top: 40vh;
            z-index: 10;
            transition: transform 0.08s ease;
        }

        .bird::after {
            content: '';
            position: absolute;
            right: -8px;
            top: 7px;
            width: 12px;
            height: 10px;
            background-color: #f75d19;
            border: 2px solid #000;
            border-radius: 2px;
        }

        .bird::before {
            content: '';
            position: absolute;
            right: 8px;
            top: 4px;
            width: 8px;
            height: 8px;
            background: #fff;
            border: 2px solid #000;
        }

        /* Retro Pipes */
        .pipe {
            position: absolute;
            width: 72px;
            border: 3px solid #000;
            z-index: 6;
            background-image: linear-gradient(to right, #a2eb5a 15%, #73bf2e 15% 85%, #558022 85%);
            transition: filter 1s ease;
        }

        .pipe-top {
            border-bottom-left-radius: 3px;
            border-bottom-right-radius: 3px;
        }

        .pipe-top::after, .pipe-bottom::before {
            content: "";
            position: absolute;
            left: -8px;
            width: 84px;
            height: 28px;
            background-image: linear-gradient(to right, #a2eb5a 15%, #73bf2e 15% 85%, #558022 85%);
            border: 3px solid #000;
            border-radius: 3px;
        }

        .pipe-top::after { bottom: -3px; }
        .pipe-bottom::before { top: -3px; }

        /* HUD & Controls UI */
        .hud-header {
            position: absolute;
            top: 15px;
            left: 0;
            width: 100%;
            padding: 0 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 25;
            color: #fff;
            font-weight: bold;
            text-shadow: 2px 2px 0 #000;
        }

        .cycle-badge {
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid #000;
            border-radius: 6px;
            padding: 6px 10px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            letter-spacing: 1px;
            box-shadow: 0 4px 0 rgba(0,0,0,0.4);
        }

        .score-board {
            position: absolute;
            top: 65px;
            width: 100%;
            text-align: center;
            font-size: 13vw;
            max-height: 80px;
            font-weight: bold;
            color: #fff;
            text-shadow: 4px 4px 0px #000;
            z-index: 20;
        }

        /* Overlay Messages */
        .message-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #fff;
            z-index: 30;
            text-align: center;
            padding: 20px;
        }

        .message-screen h1 {
            font-size: 8vw;
            max-font-size: 38px;
            margin-bottom: 10px;
            text-shadow: 3px 3px #000;
            color: #f7d519;
            letter-spacing: 2px;
        }

        .high-score-text {
            font-size: 14px;
            margin-bottom: 20px;
            color: #2ecc71;
            text-shadow: 2px 2px #000;
            letter-spacing: 1px;
        }

        .tap-prompt {
            font-size: 4.5vw;
            max-font-size: 18px;
            background: #f75d19;
            padding: 14px 28px;
            border-radius: 6px;
            border: 3px solid #000;
            cursor: pointer;
            box-shadow: 0 6px 0 #b74a12;
            font-weight: bold;
            text-shadow: 1px 1px #000;
            animation: pulseBtn 1s infinite alternate;
        }

        @keyframes pulseBtn {
            from { transform: scale(1); }
            to { transform: scale(1.05); }
        }

        .tap-prompt:active {
            transform: translateY(6px);
            box-shadow: none;
        }
    </style>
</head>
<body>

    <div class="game-wrapper" id="gameContainer">
        <!-- Sky & Celestial Layers -->
        <div class="sky-bg" id="skyBg"></div>
        <div class="stars-container" id="starsBg"></div>
        
        <div class="celestial-orbit" id="celestialOrbit">
            <div class="sun-body"></div>
            <div class="moon-body"></div>
        </div>

        <!-- Dynamic Environment Scenery -->
        <div class="clouds-layer" id="cloudsLayer"></div>
        <div class="city-layer" id="cityLayer"></div>
        <div class="city-windows" id="cityWindows"></div>
        
        <!-- HUD Header -->
        <div class="hud-header">
            <div class="cycle-badge">
                <span id="cycleIcon">☀️</span>
                <span id="cycleName">DAY</span>
            </div>
        </div>

        <div class="score-board" id="scoreBoard">0</div>
        <div class="bird" id="bird"></div>

        <!-- Nintendo Style Ground -->
        <div class="ground-container" id="ground">
            <div class="grass-top-blades"></div>
            <div class="grass-block"></div>
            <div class="dirt-block"></div>
        </div>

        <!-- Start / Game Over Screen -->
        <div class="message-screen" id="messageScreen">
            <h1 id="mainTitle">FLAPPY BIRD</h1>
            <div class="high-score-text" id="highScoreText">BEST SCORE: 0</div>
            <div class="tap-prompt" id="startBtn">TAP TO PLAY</div>
        </div>
    </div>

    <script>
        const gameContainer = document.getElementById('gameContainer');
        const bird = document.getElementById('bird');
        const scoreBoard = document.getElementById('scoreBoard');
        const messageScreen = document.getElementById('messageScreen');
        const startBtn = document.getElementById('startBtn');
        const highScoreText = document.getElementById('highScoreText');

        // Celestial & Cycle DOM Elements
        const skyBg = document.getElementById('skyBg');
        const starsBg = document.getElementById('starsBg');
        const celestialOrbit = document.getElementById('celestialOrbit');
        const cloudsLayer = document.getElementById('cloudsLayer');
        const cityLayer = document.getElementById('cityLayer');
        const cityWindows = document.getElementById('cityWindows');
        const ground = document.getElementById('ground');
        const cycleIcon = document.getElementById('cycleIcon');
        const cycleName = document.getElementById('cycleName');

        // Game Physics & State Variables
        let birdY = window.innerHeight * 0.4;
        let velocity = 0;
        let gravity = 0.5;
        let jump = -8.5;
        let score = 0;
        let highScore = localStorage.getItem('flappy_high_score') || 0;
        let isPlaying = false;
        let pipes = [];
        let gameInterval;
        let frameCounter = 0;

        // Day/Night Cycle State (Locked to Auto)
        let cycleProgress = 0; // 0 to 1 (0: Day, 0.25: Sunset, 0.5: Night, 0.75: Dawn)
        let cycleSpeed = 0.0003; // Auto progress step

        // Color Palettes for Tiny Wings style transitions
        const PALETTES = {
            day: {
                skyTop: '#4ec0ca', skyBottom: '#81d4e1',
                cloud: '#dbf1cd', city: '#81d4e1', cityDark: '#71c4d1',
                filterGround: 'brightness(1) contrast(1)',
                filterPipes: 'brightness(1)',
                windowsOpacity: 0, starsOpacity: 0,
                icon: '☀️', name: 'DAY'
            },
            sunset: {
                skyTop: '#f39c12', skyBottom: '#e74c3c',
                cloud: '#f8c291', city: '#e67e22', cityDark: '#d35400',
                filterGround: 'sepia(0.3) hue-rotate(-20deg) brightness(0.9)',
                filterPipes: 'sepia(0.4) hue-rotate(-30deg) brightness(0.95)',
                windowsOpacity: 0.3, starsOpacity: 0.1,
                icon: '🌅', name: 'SUNSET'
            },
            night: {
                skyTop: '#0b1021', skyBottom: '#1a237e',
                cloud: '#2c3e50', city: '#111726', cityDark: '#0a0e17',
                filterGround: 'brightness(0.4) contrast(1.2) hue-rotate(180deg)',
                filterPipes: 'brightness(0.5) hue-rotate(140deg)',
                windowsOpacity: 1, starsOpacity: 0.9,
                icon: '🌙', name: 'NIGHT'
            },
            dawn: {
                skyTop: '#4a148c', skyBottom: '#f8bbd0',
                cloud: '#e1bee7', city: '#6a1b9a', cityDark: '#4a148c',
                filterGround: 'brightness(0.7) hue-rotate(240deg)',
                filterPipes: 'brightness(0.75) hue-rotate(200deg)',
                windowsOpacity: 0.2, starsOpacity: 0.2,
                icon: '🌄', name: 'DAWN'
            }
        };

        // Initialize High Score Display
        highScoreText.textContent = `BEST SCORE: ${highScore}`;

        // Web Audio Synthesizer
        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playSound(type) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            let now = audioCtx.currentTime;

            if (type === 'jump') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(320, now);
                osc.frequency.exponentialRampToValueAtTime(650, now + 0.1);
                gain.gain.setValueAtTime(0.12, now);
                gain.gain.linearRampToValueAtTime(0, now + 0.1);
                osc.start(now);
                osc.stop(now + 0.1);
            } else if (type === 'score') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(587.33, now); 
                osc.frequency.setValueAtTime(880, now + 0.08); 
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.linearRampToValueAtTime(0, now + 0.2);
                osc.start(now);
                osc.stop(now + 0.2);
            } else if (type === 'hit') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(140, now);
                osc.frequency.linearRampToValueAtTime(35, now + 0.25);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.linearRampToValueAtTime(0, now + 0.25);
                osc.start(now);
                osc.stop(now + 0.25);
            }
        }

        // Update Day/Night Cycle Graphics (Auto-progressing)
        function updateDayNightCycle() {
            // Update Orbit Rotation
            let angle = cycleProgress * 360;
            celestialOrbit.style.transform = `rotate(${angle}deg)`;

            // Determine active palette phase
            let phase;
            if (cycleProgress < 0.2) {
                phase = PALETTES.day;
            } else if (cycleProgress < 0.45) {
                phase = PALETTES.sunset;
            } else if (cycleProgress < 0.7) {
                phase = PALETTES.night;
            } else {
                phase = PALETTES.dawn;
            }

            // Apply Sky Gradients and Visual Filters
            skyBg.style.background = `linear-gradient(to bottom, ${phase.skyTop}, ${phase.skyBottom})`;
            starsBg.style.opacity = phase.starsOpacity;
            cityWindows.style.opacity = phase.windowsOpacity;

            cloudsLayer.style.setProperty('--cloud-color', phase.cloud);
            cityLayer.style.setProperty('--city-color', phase.city);
            cityLayer.style.setProperty('--city-color-dark', phase.cityDark);

            ground.style.filter = phase.filterGround;
            
            pipes.forEach(pipe => {
                pipe.topEl.style.filter = phase.filterPipes;
                pipe.bottomEl.style.filter = phase.filterPipes;
            });

            // Update HUD Indicator
            cycleIcon.textContent = phase.icon;
            cycleName.textContent = phase.name;

            // Increment Progress Automatically
            cycleProgress = (cycleProgress + cycleSpeed) % 1;
        }

        // User Input Controls
        function handleInput(e) {
            if (e.type === 'touchstart' || e.code === 'Space' || e.type === 'click') {
                if (e.type === 'touchstart') e.preventDefault();
                if (!isPlaying) {
                    startGame();
                } else {
                    velocity = jump;
                    playSound('jump');
                }
            }
        }

        window.addEventListener('keydown', handleInput);
        gameContainer.addEventListener('click', handleInput);
        gameContainer.addEventListener('touchstart', handleInput, { passive: false });

        function startGame() {
            initAudio();
            messageScreen.style.display = 'none';
            birdY = gameContainer.clientHeight * 0.4;
            velocity = 0;
            score = 0;
            scoreBoard.textContent = score;

            // Clear Active Pipes
            pipes.forEach(p => {
                p.topEl.remove();
                p.bottomEl.remove();
            });
            pipes = [];

            isPlaying = true;
            frameCounter = 0;
            clearInterval(gameInterval);
            gameInterval = setInterval(updateGame, 20);
        }

        function updateGame() {
            // Update Day/Night Cycle
            updateDayNightCycle();

            // Bird Physics
            velocity += gravity;
            birdY += velocity;
            bird.style.top = birdY + 'px';

            let rotation = Math.min(Math.max(velocity * 3.5, -30), 90);
            bird.style.transform = `rotate(${rotation}deg)`;

            let groundLimit = gameContainer.clientHeight * 0.82;
            if (birdY >= groundLimit || birdY <= 0) {
                gameOver();
                return;
            }

            // Pipe Spawning
            frameCounter++;
            if (frameCounter % 90 === 0) {
                spawnPipe();
            }

            let containerWidth = gameContainer.clientWidth;
            let birdLeft = containerWidth * 0.2;

            for (let i = pipes.length - 1; i >= 0; i--) {
                let p = pipes[i];
                p.x -= 3.5;

                p.topEl.style.left = p.x + 'px';
                p.bottomEl.style.left = p.x + 'px';

                // Score Calculation
                if (!p.passed && p.x < birdLeft - 72) {
                    p.passed = true;
                    score++;
                    scoreBoard.textContent = score;
                    playSound('score');
                }

                // Collision Detection
                let birdRight = birdLeft + 42;
                let birdBottom = birdY + 30;

                if (
                    p.x < birdRight && p.x + 72 > birdLeft &&
                    (birdY < p.topHeight || birdBottom > p.topHeight + p.gapHeight)
                ) {
                    gameOver();
                    return;
                }

                if (p.x < -80) {
                    p.topEl.remove();
                    p.bottomEl.remove();
                    pipes.splice(i, 1);
                }
            }
        }

        function spawnPipe() {
            let containerHeight = gameContainer.clientHeight;
            let playableHeight = containerHeight * 0.82;
            let gapHeight = Math.max(140, containerHeight * 0.22);
            
            let minTop = 60;
            let maxTop = playableHeight - gapHeight - 80;
            let topHeight = Math.floor(Math.random() * (maxTop - minTop + 1)) + minTop;

            let topEl = document.createElement('div');
            topEl.className = 'pipe pipe-top';
            topEl.style.height = topHeight + 'px';
            topEl.style.top = '0px';
            topEl.style.left = gameContainer.clientWidth + 'px';
            gameContainer.appendChild(topEl);

            let bottomEl = document.createElement('div');
            bottomEl.className = 'pipe pipe-bottom';
            let bottomHeight = playableHeight - (topHeight + gapHeight);
            bottomEl.style.height = bottomHeight + 'px';
            bottomEl.style.bottom = (containerHeight - playableHeight) + 'px';
            bottomEl.style.left = gameContainer.clientWidth + 'px';
            gameContainer.appendChild(bottomEl);

            pipes.push({
                x: gameContainer.clientWidth,
                topHeight: topHeight,
                gapHeight: gapHeight,
                topEl: topEl,
                bottomEl: bottomEl,
                passed: false
            });
        }

        function gameOver() {
            isPlaying = false;
            clearInterval(gameInterval);
            playSound('hit');

            if (score > highScore) {
                highScore = score;
                localStorage.setItem('flappy_high_score', highScore);
            }

            highScoreText.textContent = `BEST SCORE: ${highScore}`;
            messageScreen.style.display = 'flex';
            document.getElementById('mainTitle').textContent = 'GAME OVER';
            startBtn.textContent = 'TAP TO RETRY';
        }

        // Render Initial Standby State
        updateDayNightCycle();
    </script>
</body>
</html>
